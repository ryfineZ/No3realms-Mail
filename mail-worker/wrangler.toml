name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
binding = "db"
database_name = "cloud-mail-db"
database_id = "2cd62377-5d7c-469b-b102-04c0fee29830"

[[kv_namespaces]]
binding = "kv"
id = "fb2b3f1f9f0142c08676ee009c56a547"

# R2 需要在 Dashboard 启用后再配置
# [[r2_buckets]]
# binding = "r2"
# bucket_name = "cloud-mail-r2"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 16 * * *"]

# 自定义域名路由
[[routes]]
pattern = "mail.3jiezhiwai.com/*"
zone_name = "3jiezhiwai.com"

[[routes]]
pattern = "mail.226022.xyz/*"
zone_name = "226022.xyz"

[vars]
orm_log = false
admin = "admin@3jiezhiwai.com"

# 部署命令（wrangler 4.33 存在根目录 wrangler.jsonc 优先级 bug，需指定配置文件）:
# pnpm --prefix ../mail-vue run build && npx wrangler deploy -c wrangler.toml